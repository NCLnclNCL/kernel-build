name: Build RE220

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'KERNEL_REPO'
        required: false
        default: 'https://github.com/NCLnclNCL/re220v1_gplcode'

jobs:
  build_gpl:
    name: build ${{ matrix.gplv }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          docker pull waujito/tplax1500gpl:1.4
          docker tag waujito/tplax1500gpl:1.4 router_build

      - name: Prepare gpl code
        run: |
          git clone https://github.com/NCLnclNCL/re220v1_gplcode router
          cd router
          export PATH=/router/toolchain/buildroot-gcc463/usr/bin:$PATH
          which as
          as --version
      - name: Build GPL
        run: |
               docker run --rm -v $(pwd)/router:/router --user 1001 router_build bash -c "
               export PATH=/router/toolchain/buildroot-gcc463/usr/bin:\$PATH
               export CROSS_COMPILE=mipsel-buildroot-linux-uclibc-
               cd /router
               echo '=== TOOLCHAIN CHECK ==='
               echo CROSS_COMPILE=\$CROSS_COMPILE
               which \${CROSS_COMPILE}gcc
               which \${CROSS_COMPILE}as

               make SHELL=/bin/bash V=s -j\$(nproc)"
